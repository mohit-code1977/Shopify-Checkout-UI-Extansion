# Learn more about configuring your app at https://shopify.dev/docs/apps/tools/cli/configuration

api_version = "2026-10"
client_id = "7436005f449906a7189d6a55e97e8841"
name = "Checkout UI Extension"
application_url = "https://example.com"
embedded = true

[[extensions]]
name = "Bundle Checkout Details"
handle = "similar-collection-products"
type = "ui_extension"
uid = "29dd144d-0870-02ef-a0c0-f2f7be332bab298f4c3a"

  [[extensions.targeting]]
  module = "./src/BundleLineItem.jsx"
  target = "purchase.checkout.cart-line-item.render-after"

  [extensions.capabilities]
  api_access = true

  [extensions.settings]
  [[extensions.settings.fields]]
  key = "enable_bundle_details"
  type = "boolean"
  name = "Enable bundle details"
  description = "Show the bundle product breakdown on checkout bundle line items"

[webhooks]
api_version = "2026-10"

[access_scopes]
# Learn more at https://shopify.dev/docs/apps/tools/cli/configuration#access_scopes
scopes = "write_cart_transforms"
optional_scopes = [ ]
use_legacy_install_flow = false

[auth]
redirect_urls = [ ]


[sidekick]
extensions_summary = "Display bundle product details and breakdown in checkout."